name: CI

# One workflow, whole suite, no path filters, on a standard GitHub-hosted
# Windows runner. This public repository never uses the trading workstation.
#
# Coverage: this replaces hooks-ci, session-lifecycle-ci and truthdeck-ci,
# which between them named 27 of 72 scripts in hand-maintained argument lists.
# Everything else -- the whole Conductor subsystem, ~9k lines with ten real
# test files -- was checked by nothing (audit 2026-09-09, P1-5 / P1-6). Path
# filters are gone on purpose: they hid those scripts AND swallowed the
# ready_for_review transition, so a PR taken draft -> ready merged with
# `completed/skipped` checks and zero executed tests (P1-22).
#
# Routing: operator policy 2026-10-24 permits free standard hosted compute
# for public repositories. There is no fallback to a trusted local runner.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# Without path filters, every push runs the suite -- including the design-doc
# auto-backups the PostToolUse hook pushes in bursts. Superseding a run is the
# answer to that; reintroducing a filter is not, for the reason above.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # Preserve draft batching and the existing same-repository PR admission.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Interpreter
        run: python --version
      - name: Install
        run: python -m pip install --disable-pip-version-check pytest "ruff==0.15.20" psutil -r requirements-truthdeck-mcp.txt
      - name: Install isolated TruthDeck CLI
        shell: pwsh
        run: |
          $truthdeckHome = Join-Path $env:RUNNER_TEMP 'truthdeck-home'
          $truthdeckBin = Join-Path $truthdeckHome 'bin'
          New-Item -ItemType Directory -Path $truthdeckBin -Force | Out-Null
          $env:PATH = "$truthdeckBin;$env:PATH"
          python scripts/truthdeck_install.py install --home "$truthdeckHome" --enable-mcp none
          if ($LASTEXITCODE -ne 0) { throw 'TruthDeck installation failed' }
          $truthdeckBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify TruthDeck CLI
        shell: pwsh
        run: |
          python scripts/truthdeck_install.py status --home (Join-Path $env:RUNNER_TEMP 'truthdeck-home')
          if ($LASTEXITCODE -ne 0) { throw 'TruthDeck installation readback failed' }
          truthctl version
      - name: Lint
        run: python -m ruff check scripts
      - name: Compile
        run: python -m compileall -q scripts
      - name: Tests
        run: python -m pytest -q
