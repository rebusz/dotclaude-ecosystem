name: Session Lifecycle CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/session_state.py"
      - "scripts/session_router.py"
      - "scripts/session_lifecycle.py"
      - "scripts/state_reaper.py"
      - "scripts/curator_claims.py"
      - "scripts/codex_session_adapter.py"
      - "scripts/transcript_projection.py"
      - "scripts/install_codex_session_lifecycle.py"
      - "scripts/tests/test_session_state.py"
      - "scripts/tests/test_session_router.py"
      - "scripts/tests/test_session_lifecycle.py"
      - "scripts/tests/test_state_reaper.py"
      - "scripts/tests/test_curator_claims.py"
      - "scripts/tests/test_codex_session_adapter.py"
      - "scripts/tests/test_transcript_projection.py"
      - "scripts/tests/test_install_codex_session_lifecycle.py"
      - "skills/curator/**"
      - "templates/codex_hooks.json.template"
      - "templates/session_registry.json.template"
      - "design/plans/2026-07-25_session_lifecycle_and_hook_hardening_r1.md"
      - "design/plans/2026-07-27_cross_runtime_session_lifecycle_adapters_r1.md"
      - ".github/workflows/session-lifecycle-ci.yml"

jobs:
  lifecycle:
    if: github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest "ruff==0.15.20"
      - run: >-
          python -m pytest -q
          scripts/tests/test_session_state.py
          scripts/tests/test_session_router.py
          scripts/tests/test_session_lifecycle.py
          scripts/tests/test_state_reaper.py
          scripts/tests/test_curator_claims.py
          scripts/tests/test_codex_session_adapter.py
          scripts/tests/test_transcript_projection.py
          scripts/tests/test_install_codex_session_lifecycle.py
      - run: >-
          python -m ruff check
          scripts/session_state.py
          scripts/session_router.py
          scripts/session_lifecycle.py
          scripts/state_reaper.py
          scripts/curator_claims.py
          scripts/codex_session_adapter.py
          scripts/transcript_projection.py
          scripts/install_codex_session_lifecycle.py
          scripts/tests/test_session_state.py
          scripts/tests/test_session_router.py
          scripts/tests/test_session_lifecycle.py
          scripts/tests/test_state_reaper.py
          scripts/tests/test_curator_claims.py
          scripts/tests/test_codex_session_adapter.py
          scripts/tests/test_transcript_projection.py
          scripts/tests/test_install_codex_session_lifecycle.py
      - run: >-
          python -m compileall -q
          scripts/session_state.py
          scripts/session_router.py
          scripts/session_lifecycle.py
          scripts/state_reaper.py
          scripts/curator_claims.py
          scripts/codex_session_adapter.py
          scripts/transcript_projection.py
          scripts/install_codex_session_lifecycle.py
